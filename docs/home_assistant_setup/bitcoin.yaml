###############################################################################
# Bitcoin network data + estimated mining earnings
# Save as: packages/bitcoin.yaml (next to configuration.yaml)
#
# Data source: mempool.space public REST API (no key), polled every 5 min
# through Home Assistant's built-in RESTful integration ("rest:").
#
# Requires sensor.miners_total_hash_rate (GH/s) from bitaxe.yaml for the
# earnings sensors. The network sensors work on their own.
#
# Earnings model (expected value, not a guarantee):
#   blocks/s found  = hash_rate / (difficulty * 2^32)
#   sats/s          = blocks/s * avg_block_reward_sats * (1 - pool_fee)
#   using the 144-block average reward (subsidy + fees), so fee swings are
#   smoothed out. Network pace is already baked into difficulty.
#
# Note: device_class monetary only allows state_class "total" (or none), so the
# USD rate/price sensors carry no state_class and USD earned uses "total".
#
# OPTIONAL EXTRAS: the active YAML is what the panel needs (3 requests every
# 5 min). Blocks marked "OPTIONAL" are extra metrics the panel doesn't read but
# that make good dashboard material. They sit where they belong, so to enable
# one just uncomment it in place (remove the leading "# " on each line):
#   - Network hash rate, avg fees per block, fee share   (no extra requests)
#   - Block height                                       (+1 request)
#   - Difficulty epoch: progress, next retarget %, blocks/hours left,
#     average block time                                 (+1 request)
#   - Fee rates: fastest and economy sat/vB              (+1 request)
#   - Accrued earnings: lifetime sats/USD earned, plus daily and monthly
#     meters (the integrals + totals + utility_meter blocks at the bottom)
###############################################################################

# -----------------------------------------------------------------------------
# Pool fee (percent). Adjust from the UI, it survives restarts.
# 0 = estimate gross. Set to your pool's fee if you mine in a pool.
# -----------------------------------------------------------------------------
input_number:
  mining_pool_fee:
    name: Mining pool fee
    icon: mdi:percent
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: "%"
    mode: box

# -----------------------------------------------------------------------------
# Network data (REST, every 5 minutes)
# value_json = the parsed JSON response; value = the raw text response.
# -----------------------------------------------------------------------------
rest:
  # Price
  - resource: https://mempool.space/api/v1/prices
    scan_interval: 300
    timeout: 20
    sensor:
      - name: "BTC Price USD"
        unique_id: btc_price_usd
        value_template: "{{ value_json.USD }}"
        unit_of_measurement: "USD"
        device_class: monetary
        icon: mdi:currency-btc

  # Current difficulty (and network hash rate) from the same request
  - resource: https://mempool.space/api/v1/mining/hashrate/3d
    scan_interval: 300
    timeout: 30
    sensor:
      - name: "BTC Difficulty"
        unique_id: btc_difficulty
        value_template: "{{ (value_json.currentDifficulty / 1e12) | round(3) }}"
        unit_of_measurement: "T"
        state_class: measurement
        icon: mdi:pickaxe

      # --- OPTIONAL: network hash rate (same request) ---
      # - name: "BTC Network Hash Rate"
      #   unique_id: btc_network_hash_rate
      #   value_template: "{{ (value_json.currentHashrate / 1e18) | round(1) }}"
      #   unit_of_measurement: "EH/s"
      #   state_class: measurement
      #   icon: mdi:server-network

  # Block reward and transaction fees, averaged over the last 144 blocks (~1 day)
  - resource: https://mempool.space/api/v1/mining/reward-stats/144
    scan_interval: 300
    timeout: 20
    sensor:
      - name: "BTC Avg Block Reward"
        unique_id: btc_avg_block_reward
        value_template: >
          {% set n = value_json.endBlock - value_json.startBlock + 1 %}
          {{ (value_json.totalReward | float / n / 1e8) | round(5) }}
        unit_of_measurement: "BTC"
        state_class: measurement
        icon: mdi:cash-multiple

      # --- OPTIONAL: fee stats (same request) ---
      # - name: "BTC Avg Fees Per Block"
      #   unique_id: btc_avg_fees_per_block
      #   value_template: >
      #     {% set n = value_json.endBlock - value_json.startBlock + 1 %}
      #     {{ (value_json.totalFee | float / n / 1e8) | round(5) }}
      #   unit_of_measurement: "BTC"
      #   state_class: measurement
      #   icon: mdi:cash-fast
      #
      # - name: "BTC Fee Share Of Reward"
      #   unique_id: btc_fee_share_of_reward
      #   value_template: >
      #     {{ (value_json.totalFee | float / value_json.totalReward | float * 100) | round(2) }}
      #   unit_of_measurement: "%"
      #   state_class: measurement
      #   icon: mdi:percent-outline

  # --- OPTIONAL: block height (plain-text integer response, +1 request) ---
  # - resource: https://mempool.space/api/blocks/tip/height
  #   scan_interval: 300
  #   timeout: 20
  #   sensor:
  #     - name: "BTC Block Height"
  #       unique_id: btc_block_height
  #       value_template: "{{ value | int }}"
  #       icon: mdi:cube-outline

  # --- OPTIONAL: difficulty epoch and next retarget (+1 request) ---
  # - resource: https://mempool.space/api/v1/difficulty-adjustment
  #   scan_interval: 300
  #   timeout: 20
  #   sensor:
  #     - name: "BTC Epoch Progress"
  #       unique_id: btc_epoch_progress
  #       value_template: "{{ value_json.progressPercent | round(1) }}"
  #       unit_of_measurement: "%"
  #       icon: mdi:progress-clock
  #     - name: "BTC Difficulty Change Estimate"
  #       unique_id: btc_difficulty_change_estimate
  #       value_template: "{{ value_json.difficultyChange | round(2) }}"
  #       unit_of_measurement: "%"
  #       icon: mdi:chart-line-variant
  #     - name: "BTC Blocks To Retarget"
  #       unique_id: btc_blocks_to_retarget
  #       value_template: "{{ value_json.remainingBlocks }}"
  #       unit_of_measurement: "blocks"

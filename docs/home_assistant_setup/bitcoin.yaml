# -----------------------------------------------------------------------------
# Estimated earnings
# -----------------------------------------------------------------------------
template:
  - sensor:
      # Hourly rates: inputs for the per-day projections (and the optional
      # accrual integrals). Exclude both from the recorder.
      - name: "Mining Sats Per Hour"
        unique_id: mining_sats_per_hour
        unit_of_measurement: "sats/h"
        state_class: measurement
        icon: mdi:speedometer
        state: >
          {% set hs = states('sensor.miners_total_hash_rate') | float(0) * 1e9 %}
          {% set d = states('sensor.btc_difficulty') | float(0) * 1e12 %}
          {% set reward = states('sensor.btc_avg_block_reward') | float(0) %}
          {% set keep = 1 - (states('input_number.mining_pool_fee') | float(0) / 100) %}
          {% if d > 0 %}
            {{ (hs * 3600 / (d * 4294967296) * reward * 1e8 * keep) | round(3) }}
          {% else %}0{% endif %}
        availability: >
          {{ has_value('sensor.miners_total_hash_rate')
             and has_value('sensor.btc_difficulty')
             and has_value('sensor.btc_avg_block_reward') }}

      - name: "Mining USD Per Hour"
        unique_id: mining_usd_per_hour
        unit_of_measurement: "USD"
        device_class: monetary
        icon: mdi:cash
        state: >
          {{ (states('sensor.mining_sats_per_hour') | float(0) / 1e8
              * states('sensor.btc_price_usd') | float(0)) | round(6) }}
        availability: >
          {{ has_value('sensor.mining_sats_per_hour') and has_value('sensor.btc_price_usd') }}

      # Per-day projections at the current hash rate, difficulty and price
      - name: "Mining Sats Per Day"
        unique_id: mining_sats_per_day
        unit_of_measurement: "sats/day"
        state_class: measurement
        icon: mdi:bitcoin
        state: "{{ (states('sensor.mining_sats_per_hour') | float(0) * 24) | round(0) }}"
        availability: "{{ has_value('sensor.mining_sats_per_hour') }}"

      - name: "Mining USD Per Day"
        unique_id: mining_usd_per_day
        unit_of_measurement: "USD"
        device_class: monetary
        icon: mdi:cash
        state: "{{ (states('sensor.mining_usd_per_hour') | float(0) * 24) | round(3) }}"
        availability: "{{ has_value('sensor.mining_usd_per_hour') }}"

      # Expected time to find a block at the current hash rate and difficulty:
      #   seconds = difficulty * 2^32 / hash_rate
      # This is the solo-mining figure. In a pool, the pool finds blocks and
      # you are paid by shares, so treat it as a sense-of-scale number.
      - name: "Mining Years To Find Block"
        unique_id: mining_years_to_find_block
        unit_of_measurement: "years"
        state_class: measurement
        icon: mdi:dice-multiple
        state: >
          {% set hs = states('sensor.miners_total_hash_rate') | float(0) * 1e9 %}
          {% set d = states('sensor.btc_difficulty') | float(0) * 1e12 %}
          {% set years = d * 4294967296 / hs / 31557600 %}
          {{ years | round(0) if years >= 10 else years | round(2) }}
        availability: >
          {{ has_value('sensor.miners_total_hash_rate')
             and states('sensor.miners_total_hash_rate') | float(0) > 0
             and has_value('sensor.btc_difficulty') }}

      # --- OPTIONAL: accrued lifetime earnings (needs the integrals below) ---
      # availability stops a restart blip from looking like a meter reset.
      # - name: "Mining Sats Earned"
      #   unique_id: mining_sats_earned
      #   unit_of_measurement: "sats"
      #   state_class: total_increasing
      #   icon: mdi:bitcoin
      #   state: "{{ states('sensor.mining_sats_integral') | float(0) | round(1) }}"
      #   availability: "{{ has_value('sensor.mining_sats_integral') }}"
      #
      # - name: "Mining USD Earned"
      #   unique_id: mining_usd_earned
      #   unit_of_measurement: "USD"
      #   device_class: monetary
      #   state_class: total
      #   icon: mdi:cash-multiple
      #   state: "{{ states('sensor.mining_usd_integral') | float(0) | round(4) }}"
      #   availability: "{{ has_value('sensor.mining_usd_integral') }}"

